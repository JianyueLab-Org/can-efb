# 电子飞行包在 jyl-tyo 上的部署。
#
# 形状照着 can-dev 来（它照的是 llm-web）：一个应用一个 namespace，Deployment
# 和 Service 都叫 app，Service 暴露 80，Ingress 走默认的 cloudflare-tunnel ——
# 这个集群没有别的 ingress class，控制器会顺手把 DNS 记录建好，所以这里**没有**
# cert-manager 注解、也**没有** tls: 块，TLS 在 Cloudflare 那一侧终止。
#
# **这个站没有 Secret，一个都不需要。** can-dev 要手工注册一个 OAuth 应用、要
# CAN_CLIENT_SECRET 和 SESSION_SECRET；EFB 一样都不要，因为它根本不参与 OAuth：
# 会话由 can-api 签在**父域**上，成员在主站登录过，cookie 就跟着同源请求到这
# 里，这个站只负责把它转发回 can-api。少一份凭据就少一个泄漏面 —— 如果哪天有人
# 要在这里加 Secret，先确认那件事不能靠转发 cookie 完成。
#
# 上线前要做的一件事：把 efb.ceruleanavi.net 这个主机名接进 Cloudflare 隧道（控制
# 器会自己登记），以及确认 can-api 的会话 cookie 域覆盖 `.ceruleanavi.net`。
# **不需要**把这个域加进 can-api 的 ALLOWED_ORIGINS —— 浏览器只打本站的同源
# 反代，从不直连 can-api，那正是 src/pages/api/v1/[...path].ts 存在的理由。
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-efb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-efb
spec:
  replicas: 2
  # **滚动更新期间不留窗口。** 默认策略配上一个说走就走的进程，等于每次部署都
  # 有一两秒 502：Pod 被删时 kubelet 立刻发 SIGTERM，而它从 Service 端点里摘掉是
  # **异步**传播的，于是入口仍会把请求转给一个正在退出的进程，拿到 connection
  # refused —— 在 cloudflare-tunnel 后面，前端看到的就是 502。
  #
  # 这不是理论：can-efb 上线当天就被撞上了，集群事件里留着那条
  # `Readiness probe failed: connection refused`（老 Pod 正在被杀）。
  #
  # maxUnavailable: 0 保证新 Pod 就绪之前不摘老的；真正消掉窗口的是下面容器里的
  # preStop，两者缺一不可。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: can-efb
  template:
    metadata:
      labels:
        app: can-efb
    spec:
      # 这个站的 GHCR 包是私有的，所以要指名拉取凭据 —— can-web 和 can-controller
      # 的清单里都有这一段。secret 本身由 CI 的 `Ensure image pull secret` 用
      # GHCR_PULL_TOKEN 在本 namespace 里建，清单只负责引用它。
      #
      # 少了这两行的表现不是「拉不到镜像」这么明显：Deployment 会正常创建，
      # 然后 Pod 卡在 ImagePullBackOff，而 rollout 要等到超时才报错。
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          # 按 sha 钉住，别用 :latest —— 那个标签没有回滚故事：没有更早的标签
          # 可指，而「重启一下」实际上等于「用最后推上去的那个」。CI 两个标签
          # 都推，所以换成 sha 只是改这一行。
          image: ghcr.io/jianyuelab-org/can-efb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            # 数据全部来自 can-api。
            - name: CAN_API_ORIGIN
              value: https://api.ceruleanavi.net
            # 只用来指登录页 —— 这个站自己没有登录页，也不该有。
            - name: CAN_WEB_ORIGIN
              value: https://ceruleanavi.net
            # 航行资料（机场、跑道、航路点）来自 can-db。它自己不验会话，拿转发
            # 过去的 cookie 去问 can-api —— 所以这里仍然不需要任何 Secret。
            - name: CAN_DB_ORIGIN
              value: https://api-db.ceruleanavi.net
            # 写操作的 Origin 比对基准。必须是显式值：反代后面从 Host 推出来的
            # 是 http://，浏览器发的是 https://，永远对不上。
            - name: PUBLIC_ORIGIN
              value: https://efb.ceruleanavi.net
          # 探的是 /healthz，不是 /。`/` 在这个站上会先问一次 can-api 再 302，
          # 拿它当探活等于每 10 秒给上游加一次白流量，而且会把上游的抖动放大成
          # 自己的 Pod 重启。详见 src/pages/healthz.ts。
          # 先睡再退，把端点摘除的传播时间让出来 —— 见上面 strategy 那段。
          #
          # 睡 10 秒是因为 terminationGracePeriodSeconds 默认 30：preStop 跑完才
          # 会发 SIGTERM，留 20 秒给进程自己收尾绰绰有余。调大这个值就要一起调大
          # 宽限期，否则会被硬 kill，反而更糟。
          #
          # 用得了 exec 是因为运行时镜像是 node:22-alpine，busybox 自带 sleep。
          # 哪天基底换成 distroless，这里会**静默失效**（preStop 失败不拦停机），
          # 那时得改用进程内处理 SIGTERM 的写法。
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # runAsUser 必须是数字：镜像里写的是 USER 1000，但即使写成名字
          # kubelet 也不解析，配上 runAsNonRoot 会直接 CreateContainerConfigError。
          # can-radar 上线时踩过这一脚。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-efb
spec:
  selector:
    app: can-efb
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-efb
  namespace: can-efb
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: efb.ceruleanavi.net
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
