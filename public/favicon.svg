<!--
  占位标记，不是 logo。

  网络的正式标识是 logo-full.png，上面写的是旧名字「Airway Simulation
  Network」，不适合放在这里；而设计一个新 logo 不是这个仓库该做的事。所以这里
  只是品牌色的一块方牌加上 EFB 三个字母 —— 和轨里那块牌子一致，够在标签页上认
  出来，也不冒充任何东西。真的品牌资源到位之后连同 apple-touch-icon 和
  icon-512 一起替换（见 src/layouts/BaseLayout.astro 里那条注释）。

  颜色写死成 #4c92c1，不是从 CSS 变量取的：favicon 在文档之外渲染，拿不到页面
  的自定义属性。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CAN EFB">
  <rect width="64" height="64" rx="14" fill="#4c92c1"/>
  <text
    x="32"
    y="41"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#ffffff"
  >EFB</text>
</svg>
